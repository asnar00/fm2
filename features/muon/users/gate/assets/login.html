<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>muon</title>
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  html, body { position: fixed; inset: 0; overflow: hidden;
    overscroll-behavior: none; touch-action: manipulation; }
  html, body { margin: 0; min-height: 100vh; background: #000; color: #fff;
    font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  main { text-align: center; padding: 2rem; }
  .logo { font-size: 17vw; line-height: 1.1; user-select: none; }
  @media (min-width: 700px) { .logo { font-size: 90px; } }
  p { color: #999; margin: .6rem 0 1.6rem; }
  input { font-size: 1.3rem; text-align: center; background: #111; color: #fff;
    border: 1px solid #333; border-radius: 10px; padding: .6rem .9rem;
    width: 15rem; outline: none; }
  input:focus { border-color: #888; }
  button { font-size: 1.05rem; margin-top: 1rem; background: #fff; color: #000;
    border: 0; border-radius: 10px; padding: .6rem 1.6rem; cursor: pointer; }
  #err { color: #e66; min-height: 1.5em; margin-top: .8rem; }
  .hide { display: none; }
</style>
</head>
<body>
<main>
  <div class="logo">ᕦ(ツ)ᕤ</div>
  <p id="hint">enter your phone number</p>
  <form id="phoneStep">
    <input id="phone" type="tel" autocomplete="tel" placeholder="+44 7…" autofocus>
    <br><button>send code</button>
  </form>
  <form id="pinStep" class="hide">
    <input id="pin" inputmode="numeric" maxlength="4" pattern="[0-9]*"
           placeholder="····" autocomplete="one-time-code">
  </form>
  <button id="faceid" type="button"
    style="display:none;background:#191919;color:#fff;border:1px solid #333;margin-top:1.4rem">
    sign in with Face ID</button>
  <div id="err"></div>
</main>
<script>
document.addEventListener('gesturestart', (e) => e.preventDefault());
  const $ = (id) => document.getElementById(id);
  const post = (url, body) => fetch(url, { method: "POST",
    headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
    .then(async (r) => ({ ok: r.ok, ...(await r.json().catch(() => ({}))) }))
    .catch(() => ({ ok: false, error: "server unreachable — try again in a moment" }));
  let phone = "";
  $("phoneStep").onsubmit = async (e) => {
    e.preventDefault(); $("err").textContent = "";
    phone = $("phone").value;
    const r = await post("/auth/request", { phone });
    if (!r.ok) { $("err").textContent = r.error || "something went wrong"; return; }
    $("phoneStep").classList.add("hide"); $("pinStep").classList.remove("hide");
    $("hint").textContent = "enter the 4-digit code we texted you";
    $("pin").focus();
  };
  // iOS autofill (or the Go key) SUBMITS the pin form — a navigation that tears
  // the page down mid-verify and discards the Set-Cookie. both routes go
  // through verify(), and the form never navigates.
  let busy = false;
  const verify = async () => {
    if (busy || $("pin").value.length !== 4) return;
    busy = true; $("err").textContent = "checking…";
    const r = await post("/auth/verify", { phone, pin: $("pin").value });
    busy = false;
    if (r.ok) {
      const who = await fetch("/auth/whoami", { cache: "no-store" })
        .then((x) => x.json()).catch(() => null);
      if (who && who.authed) {
        await enrolDevice();   // first login sets the device up: Face ID + notifications
        location.replace("/?in=" + Date.now());
        return;
      }
      $("err").textContent = "logged in, but this browser did not keep the cookie";
      return;
    }
    $("err").textContent = r.error || "wrong code";
    $("pin").value = ""; $("pin").focus();
  };
  $("pinStep").onsubmit = (e) => { e.preventDefault(); verify(); };
  $("pin").oninput = verify;

  const b64uToBuf = (s) => Uint8Array.from(
    atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const bufToB64u = (b) => btoa(String.fromCharCode(...new Uint8Array(b)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const dlog = (m) => fetch("/diag/report", { method: "POST",
    body: JSON.stringify({ t: new Date().toISOString(), enrol: m }) }).catch(() => {});

  // ---- first-login device setup: Face ID + notifications, automatically.
  // both need user activation; the PIN keystroke provides it, but iOS may
  // let it lapse over the network roundtrips — failures are logged to diag
  // and the system panel buttons remain as the retry path.
  async function enrolDevice() {
    try {
      if (window.PublicKeyCredential && !localStorage.muonPasskey) {
        $("hint").textContent = "setting up Face ID…";
        const o = await post("/auth/passkey/register-challenge", {});
        if (o.ok) {
          const cred = await navigator.credentials.create({ publicKey: {
            challenge: b64uToBuf(o.challenge),
            rp: { id: o.rp_id, name: "muon" },
            user: { id: b64uToBuf(o.user_id), name: o.user_name, displayName: o.user_name },
            pubKeyCredParams: [{ type: "public-key", alg: -7 }],
            authenticatorSelection: { authenticatorAttachment: "platform",
              residentKey: "required", userVerification: "required" },
            attestation: "none" } });
          const rr = await post("/auth/passkey/register", {
            id: cred.id,
            attestation: bufToB64u(cred.response.attestationObject),
            client_data: bufToB64u(cred.response.clientDataJSON) });
          if (rr.ok) { localStorage.muonPasskey = "1"; dlog("passkey enrolled"); }
          else dlog("passkey register failed: " + (rr.error || "?"));
        }
      }
    } catch (e) { dlog("passkey skipped: " + (e && e.name ? e.name : String(e))); }
    try {
      const standalone = matchMedia("(display-mode: standalone)").matches
        || navigator.standalone === true;
      if ("PushManager" in window && standalone && !localStorage.muonPush) {
        $("hint").textContent = "enabling notifications…";
        const reg = await Promise.race([
          navigator.serviceWorker.ready,
          new Promise((resolve, reject) => setTimeout(() => reject(new Error("no sw")), 3000))]);
        const key = await fetch("/push/vapid-key").then((x) => x.text());
        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true, applicationServerKey: b64uToBuf(key.trim()) });
        const rr = await post("/push/subscribe", {
          endpoint: sub.endpoint,
          p256dh: bufToB64u(sub.getKey("p256dh")),
          auth: bufToB64u(sub.getKey("auth")) });
        if (rr.ok) { localStorage.muonPush = "1"; dlog("push enrolled"); }
        else dlog("push subscribe failed: " + (rr.error || "?"));
      }
    } catch (e) { dlog("push skipped: " + (e && e.name ? e.name : String(e))); }
  }

  // ---- Face ID (passkey) sign-in for already-enrolled devices
  if (window.PublicKeyCredential) $("faceid").style.display = "";
  $("faceid").onclick = async () => {
    $("err").textContent = "";
    try {
      const o = await post("/auth/passkey/challenge", {});
      if (!o.ok) { $("err").textContent = o.error || "no challenge"; return; }
      const cred = await navigator.credentials.get({ publicKey: {
        challenge: b64uToBuf(o.challenge), rpId: o.rp_id,
        userVerification: "required" } });
      const r = await post("/auth/passkey/login", {
        id: cred.id,
        auth_data: bufToB64u(cred.response.authenticatorData),
        client_data: bufToB64u(cred.response.clientDataJSON),
        signature: bufToB64u(cred.response.signature) });
      if (r.ok) {
        localStorage.muonPasskey = "1";   // just proved one exists — don't re-create
        await enrolDevice();              // picks up notifications if missing
        location.replace("/?in=" + Date.now());
        return;
      }
      $("err").textContent = r.error || "Face ID sign-in failed";
    } catch (e) {
      $("err").textContent = "Face ID cancelled or unavailable";
    }
  };
</script>
</body>
</html>
