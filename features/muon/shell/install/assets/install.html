<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>muon</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  html, body { position: fixed; inset: 0; overflow: hidden;
    overscroll-behavior: none; touch-action: manipulation; }
  html, body { margin: 0; min-height: 100vh; background: #000; color: #fff;
    font: 17px/1.6 -apple-system, system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  main { text-align: center; padding: 2rem; max-width: 24rem; }
  .logo { font-size: 16vw; line-height: 1.1; user-select: none; margin-bottom: 2.2rem; }
  @media (min-width: 700px) { .logo { font-size: 80px; } }
  .step { color: #ccc; margin: .9rem 0; }
  .key { display: inline-flex; align-items: center; justify-content: center;
    width: 1.9rem; height: 1.9rem; border: 1px solid #444; border-radius: 8px;
    vertical-align: middle; margin: 0 .25rem; background: #111; }
  .key svg { width: 1.05rem; height: 1.05rem; }
  b { color: #fff; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="logo">ᕦ(ツ)ᕤ</div>
  <div id="ios">
    <div class="step">tap
      <span class="key"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M5 11v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/>
      </svg></span></div>
    <div class="step">then <span class="key">⌄</span> <b>view more</b></div>
    <div class="step">then <span class="key">+</span> <b>Add to Home Screen</b></div>
  </div>
  <div id="android" style="display:none">
    <div class="step">open the browser menu <span class="key">⋮</span></div>
    <div class="step">then <b>Add to Home Screen</b></div>
  </div>
</main>
<script>
document.addEventListener('gesturestart', (e) => e.preventDefault());
  // iOS installs the page you're LOOKING AT as the app URL — so if this page
  // ever launches standalone, hand over to the app immediately.
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true)
    location.replace('/');
  if (/Android/.test(navigator.userAgent)) {
    document.getElementById('ios').style.display = 'none';
    document.getElementById('android').style.display = 'block';
  }
  fetch('diag/report', { method: 'POST', body: JSON.stringify(
    { t: new Date().toISOString(), install_screen: true,
      ua: navigator.userAgent.slice(0, 90) }) }).catch(() => {});
</script>
</body>
</html>
