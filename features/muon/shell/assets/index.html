<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>muon</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font: 16px -apple-system, system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #app { text-align: center; }
  .logo { font-size: 14vw; line-height: 1; user-select: none; }
  @media (min-width: 700px) { .logo { font-size: 98px; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="build" style="position:fixed;bottom:6px;right:10px;opacity:.35;font-size:11px"></div>
<script>
// diagnostics first, so even a broken loader reports in
const diag = (data) => fetch('diag/report', { method: 'POST',
  body: JSON.stringify({ t: new Date().toISOString(), ...data }) }).catch(() => {});
window.onerror = (msg, src, line, col) =>
  diag({ error: String(msg), at: `${src}:${line}:${col}` });

(async () => {
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

    // shell is public; data is not. logged out -> login page.
    const who = await fetch('auth/whoami', { cache: 'no-store' })
      .then(r => r.json()).catch(() => null);
    if (who && who.ok && !who.authed) { location.replace('login.html'); return; }

    const res = await fetch('client.wasm');
    const { instance } = await WebAssembly.instantiate(await res.arrayBuffer(), {});
    const packed = instance.exports.fm_entry();
    const ptr = Number(packed >> 32n), len = Number(packed & 0xFFFFFFFFn);
    const bytes = new Uint8Array(instance.exports.memory.buffer, ptr, len);
    document.getElementById('app').innerHTML = new TextDecoder().decode(bytes);

    // self-update: deploys stamp site/version (git hash). compare with the
    // version we launched from; on change, drop the cache and reload once —
    // a deploy is live on the next launch. offline: skip quietly.
    const v = await fetch('version', { cache: 'no-store' })
      .then(r => r.ok ? r.text() : null).catch(() => null);
    const running = localStorage.muonVersion || 'first-run';
    document.getElementById('build').textContent = (v || running).trim();
    diag({ launch: true, running, server: v ? v.trim() : 'offline',
           authed: !!(who && who.authed),
           sw: !!(navigator.serviceWorker && navigator.serviceWorker.controller),
           ua: navigator.userAgent.slice(0, 90) });
    if (v) {
      localStorage.muonVersion = v;
      if (running !== 'first-run' && running !== v) {
        await caches.delete('muon');
        location.reload();
      }
    }
  } catch (e) {
    diag({ error: 'loader: ' + (e && e.message ? e.message : String(e)) });
  }
})();
</script>
</body>
</html>
