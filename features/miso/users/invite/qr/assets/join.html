<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>miso</title>
<meta name="theme-color" content="#000000">
<style>
  html, body { margin: 0; min-height: 100vh; background: #000; color: #fff;
    font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  main { text-align: center; padding: 2rem; }
  .logo { font-size: 17vw; line-height: 1.1; user-select: none; }
  @media (min-width: 700px) { .logo { font-size: 90px; } }
  p { color: #999; margin: .6rem 0 1.6rem; }
  input { font-size: 1.3rem; text-align: center; background: #111; color: #fff;
    border: 1px solid #333; border-radius: 10px; padding: .6rem .9rem;
    width: 15rem; outline: none; margin-top: .6rem; }
  input:focus { border-color: #9db7d8; }
  button { font-size: 1.05rem; margin-top: 1rem; background: #fff; color: #000;
    border: 0; border-radius: 10px; padding: .6rem 1.6rem; cursor: pointer; }
  #err { color: #e66; min-height: 1.5em; margin-top: .8rem; }
  .hide { display: none; }
</style>
</head>
<body>
<main>
  <div class="logo">ᕦ(ツ)ᕤ</div>
  <p id="hint">…</p>
  <form id="whoStep" class="hide">
    <input id="name" autocomplete="name" placeholder="your name" autofocus>
    <br><input id="phone" type="tel" autocomplete="tel" placeholder="+44 7…">
    <br><button>join</button>
  </form>
  <form id="pinStep" class="hide">
    <input id="pin" inputmode="numeric" maxlength="6" pattern="[0-9]*"
           placeholder="······" autocomplete="one-time-code">
  </form>
  <div id="err"></div>
</main>
<script>
  // the stranger's whole road: check the code, take their own name and number,
  // claim, then the ordinary code login — the number is typed ONCE, which is
  // the point of the whole feature.
  const $ = (id) => document.getElementById(id);
  const post = (url, body) => fetch(url, { method: "POST", cache: "no-store",
    headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
    .then(async (r) => ({ ok: r.ok, ...(await r.json().catch(() => ({}))) }))
    .catch(() => ({ ok: false, error: "no signal — try again in a moment" }));
  const token = new URLSearchParams(location.search).get("t") || "";
  let phone = "";

  const dead = (words) => {
    $("hint").textContent = words;
    $("whoStep").classList.add("hide");
    $("pinStep").classList.add("hide");
  };

  (async () => {
    if (!token) { dead("this invite link isn't valid"); return; }
    const r = await fetch("/users/invite/qr/check?t=" + encodeURIComponent(token),
                          { cache: "no-store" })
      .then((x) => x.json()).catch(() => null);
    if (!r || !r.ok) { dead((r && r.error) || "this invite link isn't valid"); return; }
    $("hint").textContent = (r.by ? r.by + " invited you" : "you're invited");
    $("whoStep").classList.remove("hide");
    $("name").focus();
  })();

  let busy = false;
  $("whoStep").onsubmit = async (e) => {
    e.preventDefault();
    if (busy) return;
    busy = true; $("err").textContent = "";
    phone = $("phone").value;
    const c = await post("/users/invite/qr/claim",
                         { t: token, name: $("name").value, phone });
    if (!c.ok) { busy = false; $("err").textContent = c.error || "that didn't work"; return; }
    if (c.in) {
      // the claim itself logged this device in (a later node's answer; the
      // base never says `in`): confirm the cookie stuck and open the app
      const who = await fetch("/auth/whoami", { cache: "no-store" })
        .then((x) => x.json()).catch(() => null);
      if (who && who.authed) { location.replace("/?in=" + Date.now()); return; }
      busy = false;
      $("err").textContent = "you're in, but this browser did not keep the cookie";
      return;
    }
    const s = await post("/auth/request", { phone });
    busy = false;
    if (!s.ok) { $("err").textContent = s.error || "couldn't send the code"; return; }
    $("whoStep").classList.add("hide");
    $("pinStep").classList.remove("hide");
    $("hint").textContent = "enter the code we texted you";
    $("pin").focus();
  };

  // iOS autofill (or the Go key) SUBMITS the pin form — a navigation that tears
  // the page down mid-verify and discards the Set-Cookie. Both routes go
  // through verify(), and the form never navigates.
  const verify = async () => {
    if (busy || $("pin").value.length !== $("pin").maxLength) return;
    busy = true; $("err").textContent = "checking…";
    const r = await post("/auth/verify", { phone, pin: $("pin").value });
    busy = false;
    if (r.ok) {
      const who = await fetch("/auth/whoami", { cache: "no-store" })
        .then((x) => x.json()).catch(() => null);
      if (who && who.authed) { location.replace("/?in=" + Date.now()); return; }
      $("err").textContent = "logged in, but this browser did not keep the cookie";
      return;
    }
    $("err").textContent = r.error || "wrong code";
    $("pin").value = ""; $("pin").focus();
  };
  $("pinStep").onsubmit = (e) => { e.preventDefault(); verify(); };
  $("pin").oninput = verify;
</script>
</body>
</html>
